<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif}.small{font-size:14px;letter-spacing:2px}.body{font-size:18px}.title{font-size:30px;font-weight:650}</style><rect width="1200" height="330" rx="20" fill="#f4f4ed"/><text x="34" y="43" class="small" fill="#557268">QUALITY EVIDENCE / FROM PREVENTION TO OBSERVED OUTCOMES</text><rect x="34" y="75" width="364" height="216" rx="15" fill="white" stroke="#dce5d9"/><text x="54" y="115" fill="#153b35" font-size="25" font-weight="650">Protection</text><text x="54" y="145" fill="#63786d" font-size="15">Are required controls working?</text><circle cx="57" cy="177" r="4" fill="#df825d"/><text x="71" y="182" fill="#315a4c" font-size="15">Verified risk mitigation</text><circle cx="57" cy="208" r="4" fill="#df825d"/><text x="71" y="213" fill="#315a4c" font-size="15">Critical process assurance</text><circle cx="57" cy="239" r="4" fill="#df825d"/><text x="71" y="244" fill="#315a4c" font-size="15">Unresolved critical risks</text><rect x="423" y="75" width="364" height="216" rx="15" fill="white" stroke="#dce5d9"/><text x="443" y="115" fill="#153b35" font-size="25" font-weight="650">Prevention</text><text x="443" y="145" fill="#63786d" font-size="15">Are we resolving issues early?</text><circle cx="446" cy="177" r="4" fill="#df825d"/><text x="460" y="182" fill="#315a4c" font-size="15">Shift-left readiness</text><circle cx="446" cy="208" r="4" fill="#df825d"/><text x="460" y="213" fill="#315a4c" font-size="15">Preventive findings resolved</text><circle cx="446" cy="239" r="4" fill="#df825d"/><text x="460" y="244" fill="#315a4c" font-size="15">Non-functional assurance</text><rect x="812" y="75" width="364" height="216" rx="15" fill="white" stroke="#dce5d9"/><text x="832" y="115" fill="#153b35" font-size="25" font-weight="650">Learning</text><text x="832" y="145" fill="#63786d" font-size="15">What changes after delivery?</text><circle cx="835" cy="177" r="4" fill="#df8