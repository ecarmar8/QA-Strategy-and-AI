<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 495" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif}.small{font-size:14px;letter-spacing:2px}.body{font-size:18px}.title{font-size:30px;font-weight:650}</style><rect width="1200" height="495" rx="20" fill="#f4f4ed"/><text x="34" y="48" class="small" fill="#557268">ONE OPERATING CYCLE / ADAPT TO THE ACTUAL CONTEXT</text><rect x="34" y="85" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="54" y="117" fill="#517a63" font-size="13">01</text><text x="54" y="155" fill="#153b35" font-size="25" font-weight="650">Discover</text><text x="54" y="188" fill="#63786d" font-size="14">Product, people and delivery</text><text x="54" y="211" fill="#63786d" font-size="14">map</text><path d="M306 167h14m-5 -5 5 5-5 5" fill="none" stroke="#77977d" stroke-width="2"/><rect x="326" y="85" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="346" y="117" fill="#517a63" font-size="13">02</text><text x="346" y="155" fill="#153b35" font-size="25" font-weight="650">Diagnose</text><text x="346" y="188" fill="#63786d" font-size="14">Evidence-backed gap and</text><text x="346" y="211" fill="#63786d" font-size="14">escape analysis</text><path d="M598 167h14m-5 -5 5 5-5 5" fill="none" stroke="#77977d" stroke-width="2"/><rect x="618" y="85" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="638" y="117" fill="#517a63" font-size="13">03</text><text x="638" y="155" fill="#153b35" font-size="25" font-weight="650">Define</text><text x="638" y="188" fill="#63786d" font-size="14">Risk/control baseline and</text><text x="638" y="211" fill="#63786d" font-size="14">focused plan</text><path d="M890 167h14m-5 -5 5 5-5 5" fill="none" stroke="#77977d" stroke-width="2"/><rect x="910" y="85" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="930" y="117" fill="#517a63" font-size="13">04</text><text x="930" y="155" fill="#153b35" font-size="25" font-weight="650">Prevent</text><text x="930" y="188" fill="#63786d" font-size="14">Confirmed rules, decisions</text><text x="930" y="211" fill="#63786d" font-size="14">and testability</text><rect x="34" y="275" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="54" y="307" fill="#517a63" font-size="13">05</text><text x="54" y="345" fill="#153b35" font-size="25" font-weight="650">Design</text><text x="54" y="378" fill="#63786d" font-size="14">Cases, oracles, data and</text><text x="54" y="401" fill="#63786d" font-size="14">readiness</text><path d="M306 357h14m-5 -5 5 5-5 5" fill="none" stroke="#77977d" stroke-width="2"/><rect x="326" y="275" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="346" y="307" fill="#517a63" font-size="13">06</text><text x="346" y="345" fill="#153b35" font-size="25" font-weight="650">Verify</text><text x="346" y="378" fill="#63786d" font-size="14">UI/API/data/NFR evidence and</text><text x="346" y="401" fill="#63786d" font-size="14">defects</text><path d="M598 357h14m-5 -5 5 5-5 5" fill="none" stroke="#77977d" stroke-width="2"/><rect x="618" y="275" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="638" y="307" fill="#517a63" font-size="13">07</text><text x="638" y="345" fill="#153b35" font-size="25" font-weight="650">Decide</text><text x="638" y="378" fill="#63786d" font-size="14">Risk-based assessment and</text><text x="638" y="401" fill="#63786d" font-size="14">next decision</text><path d="M890 357h14m-5 -5 5 5-5 5" fill="none" stroke="#77977d" stroke-width="2"/><rect x="910" y="275" width="268" height="163" rx="15" fill="white" stroke="#dce5d9"/><text x="930" y="307" fill="#517a63" font-size="13">08</text><text x="930" y="345" fill="#153b35" font-size="25" font-weight="650">Improve</text><text x="930" y="378" fill="#63786d" font-size="14">Production feedback,</text><text x="930" y="401" fill="#63786d" font-size="14">mentoring and learning</text><text x="34" y="472" fill="#557268" font-size="15">Leadership, source review and risk decisions connect every stage. Feedback returns to the relevant activity.</text></svg>
