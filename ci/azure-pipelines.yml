# Bind this reviewed template to an actual Azure DevOps pipeline and required branch/stage policy.
trigger: none
pool:
  vmImage: ubuntu-latest
steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
- script: npm ci
  displayName: Install locked dependencies
- script: npx playwright install --with-deps chromium
  displayName: Install browser dependencies
- script: npm run test:automation
  displayName: Required UI API and quality checks
- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: JUnit
    testResultsFiles: 'reports/automation/*.xml'
    failTaskOnFailedTests: true
    failTaskOnFailureToPublishResults: true
    failTaskOnMissingResultsFile: true
- task: PublishPipelineArtifact@1
  condition: succeededOrFailed()
  inputs:
    targetPath: reports/automation
    artifact: quality-evidence
